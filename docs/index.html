function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, 1000 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.72)); };
    img.onerror = rej; img.src = url;
  });
}

  };
  const csv = () => { const log = store.get("log", []); const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
    return "﻿時間,關卡,我的提示,AI做了什麼,我的決定,理由\n" + log.map((r) => [r.time, r.unit, r.prompt, r.ai, r.dec, r.why].map(q).join(",")).join("\n"); };
  $("#l_csv").onclick = () => {
    if (isNative()) { copyText(csv()); toast("App 內無法下載檔案，已複製 CSV 內容"); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv()], { type: "text/csv" })); a.download = "監督日誌.csv"; a.click();
  };
  $("#l_share").onclick = () => shareText("我的監督日誌", store.get("log", []).map((r) => `${r.unit}｜${r.dec}\n提示：${r.prompt}\nAI：${r.ai}\n理由：${r.why}`).join("\n\n") || "還沒有紀錄");
}

document.addEventListener("click", (e) => {
  const ext = e.target.closest("[data-ext]"); if (ext) { e.preventDefault(); openExt(ext.href); return; }
  const z = e.target.closest("[data-zoom]"); if (z) { const box = $("#zoom"); box.querySelector("img").src = z.src; box.style.display = "block"; return; }
  const cp = e.target.closest("[data-copy]"); if (cp) { copyText(crispText(UNITS.find((u) => u.n === +cp.dataset.copy).crisp)); return; }
  const dn = e.target.closest("[data-done]"); if (dn) { const n = +dn.dataset.done; let d = store.get("done", []); d = d.includes(n) ? d.filter((x) => x !== n) : d.concat(n); store.set("done", d); toast(d.includes(n) ? "過關！" : "已取消"); render(); return; }
  const op = e.target.closest(".quiz button.opt"); if (op) { const q = op.closest(".quiz"); const u = UNITS.find((x) => x.n === +q.dataset.unit);
    const ok = +op.dataset.i === u.quiz.a; q.querySelectorAll("button.opt").forEach((b) => b.classList.remove("right", "wrong"));
    op.classList.add(ok ? "right" : "wrong"); q.querySelector(".fb").textContent = (ok ? "答對了！" : "再想想。") + u.quiz.w; }
});
$("#zoomClose").onclick = () => { $("#zoom").style.display = "none"; };
$("#aboutBtn").onclick = () => { location.hash = "#about"; };
window.addEventListener("hashchange", render);
render();
if ("serviceWorker" in navigator && !isNative()) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
