# 上架 Google Play 用：手動執行，產生已簽署的 AAB（需先在 Settings → Secrets and variables → Actions 新增 4 個密鑰）
name: 建置 Google Play 上架檔（AAB）

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "版本名稱，例如 1.0.0"
        required: true
        default: "1.0.0"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 使用建置主機內建的 Android SDK，並接受授權
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: 檢查上傳金鑰
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::還沒設定 KEYSTORE_BASE64 等密鑰，請依 PLAY_STORE.md 第 2 步設定"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks

      - name: 安裝套件並同步
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: 設定版本號
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $((1000 + ${{ github.run_number }}))/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version_name }}\"/" android/app/build.gradle

      - name: 建置 AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 用上傳金鑰簽署
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab nlp-helper.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" nlp-helper.aab "$KEY_ALIAS"
          jarsigner -verify nlp-helper.aab

      - uses: actions/upload-artifact@v4
        with:
          name: nlp-helper-aab-${{ inputs.version_name }}
          path: nlp-helper.aab
