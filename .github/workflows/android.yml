# 每次更新 docs/（網頁 App）或 Android 設定，就在雲端自動產生 APK，放到 Releases 給學生下載
name: 建置 Android APK

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "android/**"
      - "resources/**"
      - "ci/**"
      - "materials/**"
      - "notebook/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 使用建置主機內建的 Android SDK，並接受授權
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: 安裝套件，把網頁 App 同步進 Android 專案
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: 設定版本號（每次建置自動加一）
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: 使用固定的除錯簽章（新版可以直接覆蓋舊版安裝）
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      # 有設定 KEYSTORE_BASE64 等 4 個密鑰 → 正式簽章（IzzyOnDroid／F-Droid 要求）
      # 沒有設定 → 沿用固定的除錯簽章
      - name: 建置 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "使用正式簽章"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            (cd android && ./gradlew assembleRelease --no-daemon --stacktrace)
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out nlp-helper.apk aligned.apk
            "$BT/apksigner" verify nlp-helper.apk
          else
            echo "使用除錯簽章"
            (cd android && ./gradlew assembleDebug --no-daemon --stacktrace)
            cp android/app/build/outputs/apk/debug/app-debug.apk nlp-helper.apk
          fi

      # 每一版都附上完整下載檔，學生用固定網址 releases/latest/download/<檔名> 就能拿到最新版
      - name: 整理下載檔（App、教材、離線網頁版、檢查碼）
        run: |
          mkdir -p dist
          cp nlp-helper.apk dist/
          cp materials/*.pdf dist/
          cp notebook/nlp_colab_template.ipynb dist/
          (cd docs && zip -qr ../dist/nlp-web-offline.zip . -x "sw.js")
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: 發布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NLP 實作小幫手 v1.0.${{ github.run_number }}
          body: |
            ## 學生下載區

            | 檔案 | 內容 | 適用 |
            |---|---|---|
            | [nlp-helper.apk](https://github.com/pjkuo/nlp-detective-app/releases/download/v1.0.${{ github.run_number }}/nlp-helper.apk) | Android App | Android 7.0 以上 |
            | [nlp-web-offline.zip](https://github.com/pjkuo/nlp-detective-app/releases/download/v1.0.${{ github.run_number }}/nlp-web-offline.zip) | 離線網頁版：解壓縮後開啟 index.html | Windows／Mac／Chromebook |
            | [nlp-handout.pdf](https://github.com/pjkuo/nlp-detective-app/releases/download/v1.0.${{ github.run_number }}/nlp-handout.pdf) | 教學講義 | 全部 |
            | [nlp-slides.pdf](https://github.com/pjkuo/nlp-detective-app/releases/download/v1.0.${{ github.run_number }}/nlp-slides.pdf) | 上課簡報 | 全部 |
            | [nlp_colab_template.ipynb](https://github.com/pjkuo/nlp-detective-app/releases/download/v1.0.${{ github.run_number }}/nlp_colab_template.ipynb) | Colab 範本筆記本（也可[直接在 Colab 開啟](https://colab.research.google.com/github/pjkuo/nlp-detective-app/blob/main/notebook/nlp_colab_template.ipynb)） | 全部 |
            | [qr-poster-A4.pdf](https://github.com/pjkuo/nlp-detective-app/releases/download/v1.0.${{ github.run_number }}/qr-poster-A4.pdf) | 教室 QR 海報 | 教師 |
            | [SHA256SUMS.txt](https://github.com/pjkuo/nlp-detective-app/releases/download/v1.0.${{ github.run_number }}/SHA256SUMS.txt) | 檔案檢查碼 | 想驗證檔案的人 |

            不想下載？手機直接開[網頁版](https://pjkuo.github.io/nlp-detective-app/)，選「加到主畫面」。

            ### 安裝 Android App
            1. 用手機點 nlp-helper.apk 下載，下載完按「開啟」。
            2. 手機詢問是否允許「安裝不明來源的應用程式」時選「允許」，再按「安裝」。
            3. 之後有新版，重新下載安裝即可覆蓋，日誌與進度會保留。

            ### 安全
            - 所有檔案都由 GitHub Actions 從本 repo 的公開原始碼自動建置，沒有廣告、沒有追蹤。
            - 請只從本頁、課程 Moodle 或 QR code 下載。
            - 照片、IPO、日誌只存在自己的手機，見[隱私權政策](https://pjkuo.github.io/nlp-detective-app/privacy.html)。
          files: dist/*
          make_latest: true
